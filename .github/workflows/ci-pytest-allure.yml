# CI：每次推送后自动跑 Pytest + 生成 Allure 报告
# 使用说明见 docs/CI设置说明.md

name: CI - lazzy - Pytest + Allure   #给自动化流程起名字

on:  #触发的动作
  push:
    branches: [ main, master ]  # 推代码到main/master分支时触发：① 你把代码推送到仓库的 main 或 master
  pull_request:
    branches: [ main, master ]  # 向main/master分支提PR时触发：② 有人向 main/master 分支提交 Pull Request（代码合并请求）。

#  第一个任务：test（跑测试 + 生成报告）
jobs:
  test:   # 任务名：test
    runs-on: ubuntu-latest  # 运行在GitHub的Ubuntu最新版服务器上
    permissions:  # 给这个任务的权限（后续部署报告需要）
      contents: read  # 能读取仓库代码
      pages: write  # 能写GitHub Pages（发布报告）
      id-token: write  # 身份验证需要

    steps:  # test任务的具体步骤（一步一步执行）
      - name: 拉取代码  #拉取代码到云端服务器：步骤的名字
        uses: actions/checkout@v4  #使用 GitHub 官方的「拉取代码」插件，把你仓库的代码下载到云端服务器上（不然服务器没代码，没法跑测试）。

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 若项目需要 .env（如测真实后端），在仓库 Settings → Secrets 里配 SERVER_URL、PUBLIC_KEY
#      - name: 生成 .env（可选）
#        run: |
#          echo "SERVER_URL=${{ secrets.SERVER_URL }}" >> .env
#          echo "PUBLIC_KEY=${{ secrets.PUBLIC_KEY }}" >> .env
#        continue-on-error: true

      - name: 设置 Java（Allure 依赖）
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: 安装 Allure CLI
        run: |
          sudo apt-get update && sudo apt-get install -y wget
          wget -q https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.tgz -O allure.tgz
          tar -xzf allure.tgz
          sudo mv allure-2.29.0 /opt/allure
          echo "/opt/allure/bin" >> $GITHUB_PATH
          /opt/allure/bin/allure --version

      - name: 运行 Pytest（结果写入 allure-results）
        run: |
          pytest -v --alluredir=allure-results --clean-alluredir
        continue-on-error: true

      - name: 生成 Allure 报告
        if: always()
        run: |
          /opt/allure/bin/allure generate allure-results -o allure-report --clean

      - name: 上传 Allure 报告（Artifact）
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
        if: always()

      # 部署到 GitHub Pages（在线看报告）
      # 需在仓库 Settings → Pages → Source 选 "GitHub Actions"
      - name: 部署报告到 GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report/
        if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

